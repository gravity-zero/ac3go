name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "40 4 * * *"

# AC3GO_E2E_REQUIRED is deliberately NOT set anywhere in this file.
#
# It turns every reason the end to end harness would skip into a failure, which
# is what keeps a broken oracle from reading as a green run. But the oracle is a
# reference decoder in a local container plus a corpus of real media that is not
# in this repository and never will be, and a hosted runner has neither. Setting
# it here would not test more, it would fail every job, every time.
#
# So the split is: this file proves the decoder against what the repository can
# carry - unit tests, fixtures, cross builds, fuzzing. The comparison against
# the reference happens on the development machine, and that is where the
# variable belongs:
#
#   AC3GO_E2E_REQUIRED=1 AC3GO_E2E=docker:evey-server AC3GO_E2E_TOOL=ffmpeg \
#   AC3GO_E2E_PROBE=ffprobe AC3GO_E2E_CORPUS=/media \
#   go test ./internal/e2e/ -count=1
#
# Without the first variable that command is green whether or not the container
# answers. With it, a container that has been renamed or rebuilt without ffmpeg
# fails instead of quietly comparing nothing.
#
# If this ever runs on a self-hosted runner that does have the container and the
# corpus, that job - and only that job - should set it.

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          # The module has no dependencies and so no go.sum, which is the
          # file the action's build cache is keyed on: left on, every job
          # opens with a warning that it could not find one.
          cache: false
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./... -count=1
      - name: Vet
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

  race:
    # The one place the race detector runs: it needs cgo, which the
    # development machine does not have.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          # The module has no dependencies and so no go.sum, which is the
          # file the action's build cache is keyed on: left on, every job
          # opens with a warning that it could not find one.
          cache: false
      - name: Test with the race detector
        run: go test ./... -count=1 -race

  cross:
    # The build targets a release has to hold: wasm is what the player runs,
    # and the 32-bit build is what gives the reader's size guards a platform
    # where they can fire.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          # The module has no dependencies and so no go.sum, which is the
          # file the action's build cache is keyed on: left on, every job
          # opens with a warning that it could not find one.
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Build for wasm
        env:
          CGO_ENABLED: "0"
          GOOS: js
          GOARCH: wasm
        run: go build ./...
      - name: Build, vet and test for 386
        # A 64-bit build cannot reach the bit reader's size guard; the 32-bit
        # tests are the ones that actually execute it.
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: "386"
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

  fuzz:
    # Nightly only: each target gets a bounded slice, and the corpus grows
    # across nights through the cache, which is how a crasher that needs a
    # mature corpus eventually surfaces.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          # The module has no dependencies and so no go.sum, which is the
          # file the action's build cache is keyed on: left on, every job
          # opens with a warning that it could not find one.
          cache: false
      - uses: actions/cache@v5
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz each target
        # The toolchain has a race of its own at the end of -fuzztime: the
        # coordinator can wake on the deadline before the cancellation has
        # reached the workers' context, and then reports the deadline itself
        # as a failure - "context deadline exceeded", no failing input, after
        # a full slice of clean fuzzing. That one outcome is let through, by
        # its exact signature. Anything that wrote a failing input still fails.
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          fuzz() {
            echo "::group::$1 $2"
            local status=0
            go test -run '^$' -fuzz "^$2\$" -fuzztime=60s "./$1" 2>&1 | tee fuzz.log || status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            if grep -q 'context deadline exceeded' fuzz.log && ! grep -q 'Failing input written' fuzz.log; then
              echo "::warning::$1 $2: the fuzz deadline was reported as a failure, no failing input - let through"
              return 0
            fi
            return "$status"
          }
          set -eo pipefail
          fuzz bitstream FuzzReader
          for t in FuzzParseSyncInfo FuzzParseHeader FuzzCheckCRC FuzzFrameReader FuzzNextAccessUnit FuzzDecodeFrame; do
            fuzz ac3 "$t"
          done
      - name: Keep any crasher
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
